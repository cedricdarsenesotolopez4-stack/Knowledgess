
name: Build Knowledgess APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project ZIP
        run: unzip -q Knowledgess_descomprimido.zip

      - name: Build Debug APK
        run: gradle -p Knowledgess_extraido assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Knowledgess-APK
          path: Knowledgess_extraido/app/build/outputs/apk/debug/*.apk
